    "text": "[SRVO-021 SRDY off (Group:i Axis:j)]\n(Explanation) The HRDY is on and the SRDY is off, although there is no other cause of an alarm. (HRDY is a signal with which the host detects the servo system whether to turn on or off the servo amplifier magnetic contactor. SRDY is a signal with which the servo system informs the host whether the magnetic contactor is turned on.) \nIf the servo amplifier magnetic contactor cannot be turned on when directed so, it is most likely that a servo amplifier alarm has occurred. If a servo amplifier alarm has been detected, the host will not issue this alarm (SRDY off). Therefore, this alarm indicates that the magnetic contactor cannot be turned on for an unknown reason. \n- (Action 1) Make sure that the emergency stop board connectors CP5A, CRMA92, CRMB22, and 6-Axis servo amplifier CRMA91 are securely attached to the servo amplifier. In case of using aux. axis amplifier, make sure that the connectors CXA2A (6-axis amplifier) or CXA2B (aux. axis amplifier) are securely attached to the servo amplifier. \n(Action 2) It is possible that an instant disconnection of power source causes this alarm. Check whether an instant disconnection occurred. \n(Action 3) Replace the E-stop unit. (Action 4) Replace the servo amplifier."

    "text": "[SRVO-024 Move error excess (G:i A:j)]\n(Explanation) When the robot is running, its position error is greater than a specified value ($PARAM _ GROUP. $MOVER _ OFFST). It is likely that the robot cannot follow the speed specified by program. \n(Action 1) Take the same actions as SRVO-023.\n\n[ENRICHMENT FROM SRVO-023]:\n(Explanation) When the servo is at stop, the position error is abnormally large. \nCheck whether the brake is released through the clack sound of the brake or vibration. \nIn case that the brake is not released. \n(Action 1) If the brake is not released, check the continuity of the brake line in the robot connection cable and the mechanical unit cable. \n(Action 2) If the disconnection is not found, replace the 6-Axis servo amplifier or the servo motor. \nIn case that the brake is released. (Action 1) Check whether the obstacle disturbs the robot motion.\n## 3. TROUBLESHOOTING \n- (Action 2) Make sure that connectors CNJ1A-CNJ6 are securely attached to the 6-Axis servo amplifier. \n- (Action 3) Check the continuity of the robot connection cable and the internal robot power cable. \n- (Action 4) Check to see if the load is greater than the rating. If greater, reduce it to within the rating. (If the load is too great, the torque required for acceleration / deceleration becomes higher than the capacity of the motor. \n- As a result, the motor becomes unable to follow the command, and an alarm is issued.) \n- (Action 5) Check the input voltage to the controller is within the rated voltage and no phase is lack. \n- Check each phase voltage of the CRR38A or CRR38B connector of the three-phase power (200 VAC) input to the 6-Axis servo amplifier. If it is 210 VAC or lower, check the line voltage. (If the voltage input to the 6-Axis servo amplifier becomes low, the torque output also becomes low. As a result, the motor may become unable to follow the command, hence possibly causing an alarm.). \n- (Action 6) Replace the servo amplifier. (Action 7) Replace the motor of the alarm axis. \nIncorrect setting of the brake number causes this alarm. \n6-Axis servo amplifier \n**SRVO-018 Brake abnormal SRVO-021 SRDY off SRVO-022 SRDY on SRVO-023 Stop error excess**"

      "SRVO-043"

    "text": "[SRVO-043 DCAL alarm (Group:i Axis:j)]\n3. TROUBLESHOOTING \nvertical axis, the robot operates from the potential energy. If a reduction in the potential energy is higher than the energy needed for acceleration, the servo amplifier receives energy from the motor. A similar phenomenon occurs even when no gravity is applied, for example, at deceleration on a horizontal axis. The energy that the servo amplifier receives from the motor is called the regenerative energy. The servo amplifier dissipates this energy as heat. If the regenerative energy is higher than the energy dissipated as heat, the difference is stored in the servo amplifier, causing an alarm.) \n(Action 1) This alarm may occur if the axis is subjected to frequent acceleration/deceleration or if the axis is vertical and generates a large amount of regenerative energy. If this alarm has occurred, relax the service conditions. \n- (Action 2) Check fuse (FS3) in the 6-Axis servo amplifier. If it has blown, remove the cause, and replace the fuse. \n- (Action 3) The ambient temperature is excessively high. Or the regenerative resistor can't be cooled effectively. Check the external fan unit and related fuses. Clean up the fun unit, the regenerative resistor and the louver if they are dirty. \n(Action 4) Make sure that the 6-Axis servo amplifier CRR63A and CRR63B connectors are connected tightly. Then detach the cable from CRR63A and CRR63B connectors on the 6-Axis servo amplifier, and check for continuity between pins 1 and 2 of the cable-end connector. If there is no continuity between the pins, replace the regenerative resistor. \n(Action 5) Make sure that the 6-Axis servo amplifier CRRA11A and CRRA11B are connected tightly, then detach the cables from CRRA11A and CRRA11B on the 6-Axis servo amplifier and check the resistance between pins 1 and 3 of each cable end connector. If the resistance is not 6.5 \u2126 , replace the regenerative resistor. CRRA11B may not be used depending on the robot model. \n(Action 6) Replace the 6-Axis servo amplifier. \nRegenerative resistor Regenerative resistor \n**(Small size) (Middle/Large size)** \n**Fig.3.5 (ja) SRVO-043 DCAL alarm** \n6-Axis servo amplifier E-stop unit Fig.3.5 (jb) SRVO-043 DCAL alarm"

      "SRVO-068",
      "SRVO-058"
    ],
    "text": "[SRVO-058 FSSB xx init error (yy)]\n(Explanation) Communication was interrupted between the main board and servo amplifier. (Action 1) Check whether fuse (FS1) on the 6-Axis servo amplifier has blown. If the fuse has blown, replace the 6-Axis servo amplifier including the fuse. (Action 2) Turn off the power and disconnect the CRF8 connector on the 6-Axis servo amplifier. Then check whether this alarm occurs again. (Ignore the alarm SRVO-068 because of disconnecting the CRF8 connector.) If this alarm does not occur, the robot connection cable (RMP1, RP1) or the internal cable of the robot may be short-circuited to the ground. Check the cables and replace it if necessary. (Action 3) Check whether the LED (P5V and P3.3V) on the 6-Axis servo amplifier is lit. If they are not lit, the DC power is not supplied to the 6-Axis servo amplifier. Make sure the connector CP5 on the power supply unit and the connector CXA2B on the 6-Axis servo amplifier are connected tightly. If they are connected tightly, replace the 6-Axis servo amplifier. (Action 4) Check the optical fiber cable between the axis control card and servo amplifier. Replace it if it is faulty. (Action 5) Replace the axis control card on the main board. (Action 6) Replace the 6-Axis servo amplifier. (Action 7) If the other units (the servo amplifier for the auxiliary axis and the line tracking interface) are connected in the FSSB optical communication, disconnect these units and connect only 6-Axis servo amplifier for the robot. Then turn on the power. If this alarm does not occur, search the failed unit and replace it. \nBefore executing the (Action 8), perform a complete controller back up to save all your programs and settings. \n(Action 8) Replace the main board."
  },

    "text": "[SRVO-023 Stop error excess (G:i A:j)]\n## 3. TROUBLESHOOTING \n- (Action 2) Make sure that connectors CNJ1A-CNJ6 are securely attached to the 6-Axis servo amplifier. \n- (Action 3) Check the continuity of the robot connection cable and the internal robot power cable. \n- (Action 4) Check to see if the load is greater than the rating. If greater, reduce it to within the rating. (If the load is too great, the torque required for acceleration / deceleration becomes higher than the capacity of the motor. \n- As a result, the motor becomes unable to follow the command, and an alarm is issued.) \n- (Action 5) Check the input voltage to the controller is within the rated voltage and no phase is lack. \n- Check each phase voltage of the CRR38A or CRR38B connector of the three-phase power (200 VAC) input to the 6-Axis servo amplifier. If it is 210 VAC or lower, check the line voltage. (If the voltage input to the 6-Axis servo amplifier becomes low, the torque output also becomes low. As a result, the motor may become unable to follow the command, hence possibly causing an alarm.). \n- (Action 6) Replace the servo amplifier. (Action 7) Replace the motor of the alarm axis. \nIncorrect setting of the brake number causes this alarm. \n6-Axis servo amplifier \n**SRVO-018 Brake abnormal SRVO-021 SRDY off SRVO-022 SRDY on SRVO-023 Stop error excess**"

    "text": "[SRVO-076 Tip Stick Detection (G:i A:j)]\n(Explanation) An excessive disturbance was assumed in servo software at the start of operation. (An abnormal load was detected. The cause may be welding.) \n(Action 1) Check whether the robot has collided. Or check whether the machinery load of the corresponding axis is increased. \n(Action 2) Check whether the load settings are valid. (Action 3) Check whether the brake of the corresponding axis is released. (Action 4) Check whether the load weight is within the rated range. If the weight exceeds the upper limit, decrease it to the limit. \n(Action 5) Check whether the voltage input to the controller is within the rated voltage. (Action 6) Replace the servo amplifier. (Action 7) Replace the corresponding servo motor. (Action 8) Replace the E-stop unit. (Action 9) Replace the power cable of the robot connection cable in which the corresponding axis is connected. \n(Action 10) Replace the internal cable of the robot (power/brake) in which the corresponding axis is connected. \n6-Axis servo amplifier E-stop unit \n**Fig.3.5 \n(r) SRVO-076 Tip stick detection**"

    "text": "[SRVO-223 DSP dry run (a,b)]\n(Explanation) A servo DSP initialization failure occurred due to hardware failure or wrong software setting. Then, the software entered DSP dry run mode. The first number indicates the cause of the failure. The second number is extra information. \n(Action) Perform an action according to the first number that is displayed in the alarm message. \n- 1: This is a warning due to $scr.$startup_cnd=12. \n2,3,4,7: Replace a servo card. \n- 5: Invalid ATR setting. Software axis config (FSSB line number, hardware start axis number, amplifier number, and amplifier type) might be wrong. \n- 6: SRVO-180 occurs simultaneously. Controllable axis does not exist on any group. Execute aux axis setting to add axis at controlled start. \n- 8,10: SRVO-058 (FSSB init error) occurs simultaneously. Follow the remedy of SRVO-058. \n- 9: There is no amplifier that is connected to the servo card. \n- \u2022Check the hardware connection."

    "text": "[SRVO-050 Collision Detect alarm (G:i A:j)]\n- (Explanation) The disturbance torque estimated by the servo software is abnormally high. (A collision has been detected.) \n- (Action 1) Check whether the robot has collided and also check whether there is a factor that has increased the mechanical load on the corresponding axis. \n- (Action 2) Check whether the load settings are valid. (Action 3) Check whether the brake of the corresponding axis is released. (Action 4) If the load weight exceeds the rated range, decrease it to within the limit. (Action 5) Check whether the voltage input to the controller is within the rated voltage. (Action 6) Replace the servo amplifier. (Action 7) Replace the motor of the corresponding axis. (Action 8) Replace the E-stop unit. (Action 9) Replace the motor power line (robot connection cable) of the corresponding axis. (Action 10) Replace the motor power line and brake line (internal cable of the robot) of the corresponding axis."

    "text": "[SRVO-044 DCHVAL%s alarm (G:i A:j)]\n(Explanation) The DC voltage (DC link voltage) of the main circuit power supply is abnormally high. (Action 1) Check the input voltage to the controller is within the rated voltage. And check the setting of the transformer is correct. \n- (Action 2) Check the three-phase input voltage at the 6-Axis servo amplifier. If it is 240 VAC or higher, check the line voltage. (If the three-phase input voltage is higher than 240 VAC, high acceleration/deceleration can cause in this alarm.) \n- (Action 3) Check that the load weight is within the rating. If it is higher than the rating, reduce it to within the rating. (If the machine load is higher than the rating, the accumulation of regenerative energy might result in the HVAL alarm even when the three-phase input voltage is within the rating.) \n(Action 4) Check that the CRRA11A and CRRA11B connectors of the 6-Axis servo amplifier are attached firmly. Next, detach the cables then check the continuity between pins. If the resistance is not 6.5 \u2126 , replace the regenerative resistor. CRRA11B may not be used depending on the robot model. (Action 5) Replace the 6-Axis servo amplifier."

    "text": "[SRVO-018 Brake abnormal (G:i A:j)]\n(Explanation) An excessive brake current is detected. The ALM LED (SVALM) on the 6-Axis servo amplifier is lit. \n(Action 1) Check the robot connection cable (RMP1, RP1) and the internal cable of the robot and motor brakes connected to CRR88 connector on the 6-Axis servo amplifier. If a short-circuit or grounding fault is found, replace the failed part. \n(Action 2) Check the cables and motor brakes connected to CRR65A, CRR65B connector on the 6-Axis servo amplifier. If a short-circuit or grounding fault is found, replace the failed part. \n(Action 3) Replace the 6-Axis servo amplifier. \n## **CAUTION** \nThis error can be caused by the optional brake release unit if the on/off switch is left in on position while the operator attempts to jog the robot. To recover, turn the brake release unit off and cycle the controller power."

    "text": "[SRVO-270 EXEMG1 status abnormal SRVO-271 EXEMG2 status abnormal]\n(Explanation) A chain alarm was detected with the EES (EXEMG) signal. \n(Action 1) Check whether the circuitry connected to the dual input signal (EES) is faulty. (Action 2) Check whether the timing of the dual input signal (EES) satisfies the timing specification (See Subsection 3.2.5, Fig 3.2.5\n(c) in CONNECTIONS). (Action 3) Replace the teach pendant cable. (Action 4) Replace the teach pendant. (Action 5) Replace the emergency stop board. (Action 6) Replace the emergency stop switch on the operator's panel (or replace entire operator\u2019s panel). \nBefore executing the (Action 7), perform a complete controller back up to save all your programs and settings. \n(Action 7) Replace the main board. \n## **WARNING** \nIf this alarm is issued, do not reset the chain error alarm until the failure is identified and repaired. If robot use is continued with one of the duplicate circuits being faulty, safety may not be guaranteed when the other circuit fails. \nFor the procedure of recovery from this alarm, see the descriptions of SRVO-230 and SRVO-231."

    "text": "[SRVO-062 BZAL alarm (Group:i Axis:j)]\n(Explanation) This alarm occurs if battery for Pulsecoder absolute-position backup is empty. \n- A probable cause is a broken battery cable or no batteries in the robot. \n- (Action 1) Replace the battery in the battery box of the robot base. (Action 2) Replace the Pulsecoder with which an alarm has been issued. (Action 3) Check whether the mechanical unit cable for feeding power from the battery to the Pulsecoder is not disconnected and grounded. If an abnormality is found, replace the cable. \n## **CAUTION** \n- After correcting the cause of this alarm, set the system variable ($MCR.$SPC_RESET) to TRUE then turn on the power again. Mastering is needed."

    "text": "[SRVO-045 HCAL alarm (Group:i Axis:j)]\n- (Explanation) Abnormally high current flowed in the main circuit of the servo amplifier. (Action 1) Turn off the power, and disconnect the power cable from the servo amplifier indicated by the alarm message. (And disconnect the brake cable (CRR88 on the 6-Axis servo amplifier) to avoid the axis falling unexpectedly.) Supply power and see if the alarm occurs again. If the alarm occurs again, replace the servo amplifier. \n- (Action 2) Turn off the power and disconnect the power cable from the servo amplifier indicated by the alarm message, and check the insulation of their U, V, W and the GND lines each other. If there is a short-circuit, replace the power cable. \n- (Action 3) Turn off the power and disconnect the power cable from the servo amplifier by the alarm message, and measure the resistance between their U and V, V and W and W and U with an ohmmeter that has a very low resistance range. If the resistances at the three places are different from each other, the motor, the power cable is defective. Check each item in detail and replace it if necessary."

    "text": "[SRVO-230 Chain 1 abnormal a, b SRVO-231 Chain 2 abnormal a, b]\n(Explanation) A mismatch occurred between duplicate safety signals. \nSRVO-230 is issued if such a mismatch that a contact connected on the chain 1 side (between EES1 and EES11, between EAS1 and EAS11, and so forth) is closed, and a contact on the chain 2 side (between EES2 and EES21, between EAS2 and EAS21, and so forth) is open occurs. SRVO-231 is issued if such a mismatch that a contact on the chain 1 side is open, and a contact on the chain 2 side is closed occurs. If a chain error is detected, correct the cause of the alarm then reset the alarm according to the method described later. \n(Action) Check the alarms issued at the same time in order to identify with which signal the mismatch occurred. \nSRVO-266 through SRVO-275 and SRVO-370 through SRVO-385 are issued at the same time. Take the action\n(s) described for each item. \n## **WARNING** \n- If this alarm is issued, do not reset the chain error alarm until the failure is identified and repaired. If robot use is continued with one of the duplicate circuits being faulty, safety may not be guaranteed when the other circuit fails. \n## **CAUTION** \n- 1 The state of this alarm is preserved by software. After correcting the cause of the alarm, reset the chain error alarm according to the chain error reset procedure described later. \n- 2 Until a chain error is reset, no ordinary reset operation must be performed. If an ordinary reset operation is performed before chain error resetting, the message \"SRVO-237 Chain error cannot be reset\" is displayed on the teach pendant. \n6-Axis servo amplifier E-stop unit (Emergency stop board) \n(z) SRVO-230 Chain 1 (+24V) abnormal a, b SRVO-231 Chain 2 (0V) abnormal a, b"

    "text": "[SRVO-046 OVC alarm (Group:i Axis:j)]\n- (Explanation) This alarm is issued to prevent the motor from thermal damage that might occur when the root meant square current calculated within the servo system is out of the allowable range. \n- (Action 1) Check the operating condition for the robot and relax the service condition if possible. If the load or operating condition has exceeded the rating, reduce the load or relax the operating condition to meet the rating. \n(Action 2) Check whether the voltage input to the controller is within the rated voltage. (Action 3) Check whether the brake of the corresponding axis is released. (Action 4) Check whether there is a factor that has increased the mechanical load on the corresponding axis. \n(Action 5) Replace the servo amplifier. (Action 6) Replace the motor of the corresponding axis. (Action 7) Replace the E-stop unit (Action 8) Replace the motor power line (robot connection cable) of the corresponding axis. (Action 9) Replace the motor power line and brake line (internal cable of the robot) of the corresponding axis."
  },

    "text": "[SRVO-006 Hand broken]\n- (Explanation) The safety joint (if in use) might have been broken. Alternatively, the HBK signal on the robot connection cable might be a ground fault or a cable disconnection. \n(Action 1) Hold down the shift key, and press the alarm release key to reset the alarm condition. Still hold down the shift key, and jog the tool to the work area. \n- 1) Replace the safety joint. \n2) Check the safety joint cable. (Action 2) Replace the 6-Axis servo amplifier. (Action 3) Verify the following for connector RMP1, RP1 at the base of the robot: 1) There are no bent or dislocated pins in the male or female connectors. 2) The connector is securely connected. Then verify that connectors CRF8 and CRM68 on the servo amplifier are securely connected. Also, verify that the robot connection cable (RMP1, RP1) is in good condition, and there are no cuts or kinks visible. Check the internal cable of the robot for a short circuit or connection to ground. \nIf the Hand broken signal is not in use, it can be disabled by software setting. Refer to Subsection 5.6.3 in CONNECTIONS to disable the Hand broken signal. \n6-Axis servo amplifier"

    "text": "[SRVO-001 Operator panel E-stop]\n(Explanation) The emergency stop button on the operator's panel is pressed. \n- (Action 1) Release the emergency stop button pressed on the operator's panel. (Action 2) Check the wires connecting between the emergency stop button and the emergency stop board (CRT30) for continuity. If an open wire is found, replace the entire harness. \n- (Action 3) Check the wires connecting between the teach pendant and the emergency stop board (CRS36) for continuity. If an open wire is found, replace the entire harness. \n- (Action 4) With the emergency stop in the released position, check for continuity across the terminals of the switch. If continuity is not found, the emergency stop button is broken. Replace the emergency stop button or the operator's panel. \n- (Action 5) Replace the teach pendant. (Action 6) Replace the emergency stop board. \n- Before executing the (Action 7), perform a complete controller back-up to save all your programs and settings. \n- (Action 7) Replace the main board. \nIf SRVO-001 is issued together with SRVO-213, a fuse may have blown. Take the same actions as for SRVO-213. \nEmergency stop button (R-30 iB Mate) (R-30 iB Mate Plus) Fig.3.5 \n(a) SRVO-001 Operator panel E-stop"

        var data = {
            nodes: nodes,
            edges: edges
        };
        var options = {
            nodes: {
                shape: 'dot',
                size: 16,
                font: {
                    color: '#ffffff',
                    size: 11
                },
                borderWidth: 1.5,
                borderColor: '#424242'
            },
            edges: {
                color: {
                    color: '#555555',
                    highlight: '#ffcc00',
                    hover: '#ffcc00'
                },
                scaling: {
                    min: 1,
                    max: 5
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200
            },
            physics: {
                stabilization: true,
                barnesHut: {
                    gravitationalConstant: -10000,
                    springConstant: 0.03,
                    springLength: 100
                }
            }
        };
        var network = new vis.Network(container, data, options);

        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var nodeData = nodes.get(nodeId);
                var detailDiv = document.getElementById('details');
                
                var html = '<h3 style="color: #4fc3f7; margin-top: 0;">' + nodeData.label + '</h3>';
                html += '<p><strong>File:</strong> ' + nodeData.file + '</p>';
                html += '<p><strong>Pagina:</strong> ' + nodeData.page + '</p>';
                
                if (nodeData.entities.length > 0) {
                    html += '<p><strong>Entità individuate:</strong><br/>';
                    nodeData.entities.forEach(function(ent) {
                        html += '<span style="display:inline-block; background-color:#333; padding:2px 6px; margin:2px; border-radius:4px; font-size:11px;">' + ent + '</span>';
                    });
                    html += '</p>';
                }
                
                html += '<hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;"/>';
                html += '<p style="white-space: pre-wrap; font-size: 13px; color: #e0e0e0; line-height: 1.5; font-family: monospace;">' + nodeData.text + '</p>';
                
                detailDiv.innerHTML = html;
            }
        });
