    "text": "[Connecting external on/off and external emergency stop signal input/output wires]\n||**FANUC's specification**|**Manufacturer's** **specification(WAGO)**|**Remark**|\n|4-pole terminal block (TBOP19)|A63L-0002-0154#104|734-104||\n|12-pole terminal block (TBOP20)|A63L-0002-0154#112|734-112||\n|Jumper pin|A63L-0002-0154#402F|734-402F||\n|Operation lever|A63L-0002-0154#230-M|734-230|2 pieces of 734-230 and operation manual are included in FANUC's specification|\n1. Detach the plug connector block from the emergency stop board. \n2. Insert the tip of a flat-blade screwdriver into the manipulation slot and push down its handle. \n3. Insert the end of the signal wire into the wire slot. \n4. Pull out the screwdriver. \n5. Attach the plug connector block to the emergency stop board. \n## **CAUTION** \nDo not insert a wire into the wire hole of a plug connector or pull it out with the plug connector block mounted on the emergency stop board; otherwise, the emergency stop board may be damaged. \nFANUC recommends the lever (A05B-2600-K030) for connecting the signal wire to the plug connector block instead of Flat-blade screwdriver."

                    html += '<p><strong>Entità individuate:</strong><br/>';
                    nodeData.entities.forEach(function(ent) {
                        html += '<span style="display:inline-block; background-color:#333; padding:2px 6px; margin:2px; border-radius:4px; font-size:11px;">' + ent + '</span>';
                    });
                    html += '</p>';
                }
                
                html += '<hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;"/>';
                html += '<p style="white-space: pre-wrap; font-size: 13px; color: #e0e0e0; line-height: 1.5; font-family: monospace;">' + nodeData.text + '</p>';
                
                detailDiv.innerHTML = html;
            }
        });
    </script>
</body>
</html>
